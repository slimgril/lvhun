<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>旅魂 — 陳文斌的旅途紀行</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Serif TC', 'Noto Sans TC', serif;
            background: #0d0d0d;
            color: #e8e4df;
            overflow-x: hidden;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 30px;
            background: transparent;
            position: relative;
            z-index: 10;
        }

        .header-back {
            background: none;
            border: none;
            color: #e8e4df;
            font-size: 1.5rem;
            cursor: pointer;
            padding: 8px;
        }

        .header-title {
            font-size: 0.95rem;
            font-weight: 400;
            letter-spacing: 2px;
            color: #e8e4df;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
        }

        .header-menu {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: #e8e4df;
            padding: 8px;
        }

        .hero {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            position: relative;
            padding: 40px 30px;
        }

        .hero-content {
            position: relative;
            z-index: 1;
            text-align: center;
            max-width: 700px;
            animation: fadeIn 1.2s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .hero-subtitle {
            font-size: 0.9rem;
            letter-spacing: 4px;
            color: #c9a962;
            margin-bottom: 40px;
            font-weight: 300;
        }

        .hero-title {
            font-size: 6rem;
            font-weight: 300;
            letter-spacing: 12px;
            margin-bottom: 30px;
            color: #c9a962;
            font-family: 'Noto Serif TC', serif;
            line-height: 1.1;
        }

        .hero-quote {
            font-size: 1.15rem;
            color: #a8a09a;
            line-height: 1.8;
            margin-bottom: 40px;
            letter-spacing: 2px;
            font-weight: 300;
        }

        .hero-author {
            font-size: 0.95rem;
            color: #c9a962;
            letter-spacing: 2px;
            margin-bottom: 50px;
            font-weight: 300;
        }

        .scroll-indicator {
            position: absolute;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            animation: bounce 2.5s infinite;
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateX(-50%) translateY(0);
                opacity: 0.6;
            }
            50% {
                transform: translateX(-50%) translateY(12px);
                opacity: 1;
            }
        }

        .scroll-indicator p {
            font-size: 0.85rem;
            color: #8a8580;
            letter-spacing: 2px;
            margin-bottom: 12px;
            font-weight: 300;
        }

        .scroll-indicator::after {
            content: '│';
            display: block;
            color: #8a8580;
            font-size: 1.2rem;
            line-height: 1;
        }

        @media (max-width: 768px) {
            .header-title {
                font-size: 0.8rem;
            }

            .hero {
                min-height: 90vh;
                padding: 30px 20px;
            }

            .hero-title {
                font-size: 3.5rem;
                letter-spacing: 6px;
                margin-bottom: 20px;
            }

            .hero-subtitle {
                font-size: 0.75rem;
                letter-spacing: 2px;
            }

            .hero-quote {
                font-size: 0.95rem;
                margin-bottom: 30px;
            }

            .hero-author {
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <button class="header-back">←</button>
        <div class="header-title">旅魂 — 陳文斌的旅途紀行</div>
        <button class="header-menu">⋯</button>
    </header>

    <section class="hero">
        <div class="hero-content">
            <p class="hero-subtitle">A TRAVEL MEMOIR SERIES</p>
            <h1 class="hero-title">旅魂</h1>
            <p class="hero-quote">
                雙腳踏遍世界，餘生皆為旅途
            </p>
            <p class="hero-author">陳文斌 的旅途紀行</p>
        </div>

        <div class="scroll-indicator">
            <p>SCROLL</p>
        </div>
    </section>

    <script>
        document.querySelector('.header-back').addEventListener('click', () => {
            history.back();
        });

        document.querySelector('.header-menu').addEventListener('click', () => {
            // Menu functionality here
        });

        // Scroll to next section
        document.addEventListener('wheel', (e) => {
            if (e.deltaY > 0 && window.scrollY < 100) {
                window.location.href = 'vol1/index.html';
            }
        });
    </script>
</body>
</html>
