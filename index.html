<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>旅魂 — 陳文斌的旅途紀行</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow-x: hidden;
        }

        body {
            font-family: 'Noto Serif TC', 'Noto Sans TC', Georgia, serif;
            background: #000000;
            color: #e8e4df;
        }

        .hero {
            position: relative;
            width: 100%;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(ellipse at center 30%, rgba(200, 100, 40, 0.15) 0%, rgba(0, 0, 0, 0.95) 60%);
            z-index: 0;
        }

        .hero-content {
            position: relative;
            z-index: 2;
            text-align: center;
            width: 100%;
            padding: 60px 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
        }

        .hero-main {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
            animation: fadeInScale 1.5s ease-out;
        }

        @keyframes fadeInScale {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .hero-title {
            font-size: clamp(4rem, 12vw, 9rem);
            font-weight: 300;
            letter-spacing: 0.3em;
            color: #d4a574;
            font-family: 'Noto Serif TC', Georgia, serif;
            line-height: 1;
            margin-bottom: 30px;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.8);
        }

        .hero-spirit {
            font-size: clamp(0.9rem, 2vw, 1.1rem);
            color: #b8a495;
            line-height: 1.8;
            letter-spacing: 0.08em;
            max-width: 600px;
            margin-bottom: 60px;
            font-weight: 300;
            opacity: 0.95;
        }

        .hero-footer {
            width: 100%;
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 40px 30px;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.9), transparent);
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 3;
        }

        .hero-motto {
            font-size: clamp(0.85rem, 1.5vw, 1rem);
            color: #d4a574;
            letter-spacing: 0.15em;
            margin-bottom: 20px;
            font-weight: 300;
            line-height: 1.6;
            text-align: center;
        }

        .hero-author {
            font-size: clamp(0.8rem, 1.2vw, 0.95rem);
            color: #8a8580;
            letter-spacing: 0.1em;
            margin-bottom: 20px;
            font-weight: 300;
        }

        .scroll-arrow {
            font-size: 1.2rem;
            color: #8a8580;
            animation: slideDown 2s ease-in-out infinite;
            cursor: pointer;
        }

        @keyframes slideDown {
            0%, 100% {
                transform: translateY(0);
                opacity: 0.5;
            }
            50% {
                transform: translateY(8px);
                opacity: 1;
            }
        }

        @media (max-width: 768px) {
            .hero {
                height: 100vh;
            }

            .hero-content {
                padding: 40px 20px;
            }

            .hero-title {
                margin-bottom: 20px;
            }

            .hero-spirit {
                font-size: 0.95rem;
                margin-bottom: 40px;
                max-width: 90%;
            }

            .hero-motto {
                font-size: 0.85rem;
                margin-bottom: 15px;
            }

            .hero-author {
                font-size: 0.8rem;
            }

            .hero-footer {
                padding: 30px 20px;
            }
        }

        @media (max-width: 480px) {
            .hero-title {
                font-size: 3rem;
                letter-spacing: 0.2em;
            }

            .hero-spirit {
                font-size: 0.85rem;
                line-height: 1.6;
            }

            .hero-motto {
                font-size: 0.75rem;
            }
        }
    </style>
</head>
<body>
    <section class="hero">
        <div class="hero-content">
            <div class="hero-main">
                <h1 class="hero-title">旅魂</h1>
                <p class="hero-spirit">
                    這不只是一趟趟腳步的挪移，<br>
                    而是一場用生命與天地對話的靈魂淬煉。
                </p>
            </div>

            <div class="hero-footer">
                <p class="hero-motto">
                    退休不是結束，而是另一種開始。<br>
                    用雙腳丈量世界，用餘生書寫旅途。
                </p>
                <p class="hero-author">陳文斌 的 旅途紀行</p>
                <div class="scroll-arrow" onclick="document.location.href='vol1/index.html'">↓</div>
            </div>
        </div>
    </section>
</body>
</html>
