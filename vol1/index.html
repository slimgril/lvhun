<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>第一卷《初見》— 旅魂</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Serif TC', 'Noto Sans TC', Georgia, serif;
            background: #000000;
            color: #e8e4df;
            overflow-x: hidden;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px clamp(20px, 5vw, 60px);
            background: rgba(0, 0, 0, 0.95);
            border-bottom: 1px solid rgba(212, 165, 116, 0.1);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-back {
            background: none;
            border: none;
            color: #d4a574;
            font-size: 1.5rem;
            cursor: pointer;
        }

        .header-title {
            font-size: clamp(0.85rem, 2vw, 1.1rem);
            font-weight: 400;
            letter-spacing: 0.08em;
            color: #d4a574;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
        }

        .header-menu {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: #d4a574;
        }

        .breadcrumb {
            padding: clamp(15px, 3vh, 25px) clamp(20px, 5vw, 60px);
            font-size: clamp(0.75rem, 1.2vw, 0.9rem);
            color: #8a8580;
            letter-spacing: 0.08em;
            background: rgba(0, 0, 0, 0.8);
            border-bottom: 1px solid rgba(212, 165, 116, 0.08);
            overflow-x: auto;
        }

        .breadcrumb span {
            margin: 0 0.8em;
            white-space: nowrap;
        }

        .collection-header {
            padding: clamp(40px, 8vh, 80px) clamp(20px, 5vw, 60px) clamp(20px, 4vh, 40px);
            text-align: center;
            background: rgba(0, 0, 0, 0.6);
        }

        .collection-label {
            font-size: clamp(0.8rem, 1.5vw, 1rem);
            letter-spacing: 0.2em;
            color: #d4a574;
            font-weight: 300;
            margin-bottom: 15px;
        }

        .hero-section {
            padding: clamp(40px, 8vh, 100px) clamp(20px, 5vw, 60px);
            text-align: center;
            position: relative;
        }

        .hero-card {
            position: relative;
            max-width: 700px;
            margin: 0 auto 60px;
            padding: clamp(40px, 6vh, 80px) clamp(30px, 5vw, 60px);
            background: linear-gradient(135deg, rgba(100, 90, 80, 0.15) 0%, rgba(50, 50, 50, 0.1) 100%);
            border: 1px solid rgba(212, 165, 116, 0.15);
            border-radius: 8px;
            overflow: hidden;
        }

        .hero-card::before {
            content: '壹';
            position: absolute;
            top: -30px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 120px;
            color: rgba(212, 165, 116, 0.08);
            font-weight: 300;
            line-height: 1;
            font-family: 'Noto Serif TC', serif;
        }

        .hero-title {
            font-size: clamp(2.5rem, 8vw, 4.5rem);
            font-weight: 300;
            letter-spacing: 0.15em;
            color: #d4a574;
            margin-bottom: clamp(15px, 3vh, 30px);
            font-family: 'Noto Serif TC', Georgia, serif;
            line-height: 1.1;
        }

        .hero-subtitle {
            font-size: clamp(0.9rem, 2vw, 1.1rem);
            color: #b8a495;
            line-height: 1.8;
            letter-spacing: 0.05em;
            font-weight: 300;
            margin-bottom: 40px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: clamp(20px, 4vw, 50px);
            margin: clamp(40px, 8vh, 60px) 0;
        }

        .stat-item {
            text-align: center;
        }

        .stat-number {
            font-size: clamp(2rem, 6vw, 3.5rem);
            color: #d4a574;
            font-weight: 300;
            margin-bottom: 8px;
            letter-spacing: 0.1em;
        }

        .stat-label {
            font-size: clamp(0.75rem, 1.2vw, 0.9rem);
            color: #8a8580;
            letter-spacing: 0.08em;
            font-weight: 300;
        }

        .trips-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: clamp(20px, 4vw, 40px);
            margin-top: clamp(40px, 8vh, 80px);
        }

        .trip-card {
            position: relative;
            border: 1px solid rgba(212, 165, 116, 0.2);
            border-radius: 8px;
            padding: clamp(25px, 4vh, 50px);
            background: rgba(20, 20, 20, 0.8);
            transition: all 0.4s cubic-bezier(0.23, 1, 0.320, 1);
            cursor: pointer;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
        }

        .trip-card:hover {
            border-color: #d4a574;
            background: rgba(40, 35, 30, 0.95);
            transform: translateY(-8px);
        }

        .trip-code {
            font-size: 0.7rem;
            color: #8a8580;
            letter-spacing: 0.15em;
            margin-bottom: 12px;
            font-weight: 300;
        }

        .trip-name {
            font-size: clamp(1.1rem, 2.5vw, 1.4rem);
            color: #d4a574;
            margin-bottom: 12px;
            letter-spacing: 0.05em;
            font-weight: 400;
        }

        .trip-desc {
            font-size: clamp(0.85rem, 1.5vw, 0.95rem);
            color: #b8a495;
            line-height: 1.6;
            font-weight: 300;
        }

        .footer {
            padding: clamp(40px, 8vh, 60px) clamp(20px, 5vw, 60px);
            text-align: center;
            color: #8a8580;
            border-top: 1px solid rgba(212, 165, 116, 0.1);
            font-size: clamp(0.8rem, 1.2vw, 0.9rem);
        }

        .footer-nav {
            display: flex;
            justify-content: center;
            gap: clamp(20px, 4vw, 40px);
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .footer-nav a {
            color: #d4a574;
            text-decoration: none;
            letter-spacing: 0.05em;
            transition: opacity 0.3s ease;
        }

        .footer-nav a:hover {
            opacity: 0.7;
        }

        @media (max-width: 768px) {
            .breadcrumb {
                white-space: normal;
            }

            .hero-card::before {
                font-size: 80px;
                top: -20px;
            }

            .trips-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <button class="header-back" onclick="window.location.href='../index.html'">←</button>
        <div class="header-title">第一卷《初見》— 旅魂</div>
        <div class="header-menu">⋯</div>
    </header>

    <nav class="breadcrumb">
        <span style="color: #d4a574;">旅魂</span>
        <span>|</span>
        <span>第一卷</span>
        <span>|</span>
        <span>卷冊總覽</span>
    </nav>

    <section class="collection-header">
        <div class="collection-label">COLLECTION · 卷冊一覽</div>
    </section>

    <section class="hero-section">
        <div class="hero-card">
            <h1 class="hero-title">初見</h1>
            <p class="hero-subtitle">
                這不只是一趟趟腳步的挪移，<br>
                而是一場用生命與天地對話的靈魂淬煉。
            </p>

            <div class="stats">
                <div class="stat-item">
                    <div class="stat-number">48</div>
                    <div class="stat-label">旅程天數</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number">4</div>
                    <div class="stat-label">目的地</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number">3</div>
                    <div class="stat-label">國家</div>
                </div>
            </div>
        </div>

        <div class="trips-grid">
            <a href="shanxi.html" class="trip-card">
                <div class="trip-code">Vol.1-01</div>
                <div class="trip-name">山西</div>
                <div class="trip-desc">探尋中原文明的深度，感受歷史的厚重感</div>
            </a>

            <a href="baltic.html" class="trip-card">
                <div class="trip-code">Vol.1-02</div>
                <div class="trip-name">波羅的海</div>
                <div class="trip-desc">三小國風情，北歐迷人的海灣之旅</div>
            </a>

            <a href="baikal.html" class="trip-card">
                <div class="trip-code">Vol.1-03</div>
                <div class="trip-name">西伯利亞</div>
                <div class="trip-desc">20天經典大鐵路，跨越莫斯科至太平洋</div>
            </a>
        </div>
    </section>

    <footer class="footer">
        <div class="footer-nav">
            <a href="../index.html">← 返回首頁</a>
            <a href="highlights.html">進入精選集 →</a>
        </div>
        <p>© 2026 旅魂 — 陳文斌的旅途紀行</p>
    </footer>
</body>
</html>
