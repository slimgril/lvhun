<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>第二卷《漸見》— 旅魂</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --fjord-deep: #13324A;
            --ocean-teal: #185C63;
            --morning-gold: #C8A266;
            --mist-white: #EAE8E2;
            --abyss: #0A1E2E;
        }

        body {
            font-family: 'Noto Serif TC', 'Noto Sans TC', serif;
            background: linear-gradient(165deg, var(--abyss) 0%, var(--fjord-deep) 55%, var(--ocean-teal) 100%);
            color: var(--mist-white);
            overflow-x: hidden;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background: rgba(10, 30, 46, 0.9);
            border-bottom: 1px solid rgba(200, 162, 102, 0.2);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-title {
            font-size: 1.2rem;
            font-weight: 500;
            letter-spacing: 2px;
            color: var(--morning-gold);
        }

        .header-menu {
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--morning-gold);
        }

        .breadcrumb {
            padding: 20px 40px;
            font-size: 0.9rem;
            color: #8a8f95;
            letter-spacing: 1px;
            background: rgba(10, 30, 46, 0.6);
            border-bottom: 1px solid rgba(200, 162, 102, 0.1);
        }

        .breadcrumb span {
            margin: 0 12px;
        }

        /* ── HERO — cinematic horizon ── */
        .hero {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 86vh;
            padding: 80px 40px;
            text-align: center;
            overflow: hidden;
            background: radial-gradient(ellipse at 50% 30%, rgba(24, 92, 99, 0.35) 0%, rgba(10, 30, 46, 0) 60%),
                        linear-gradient(180deg, var(--abyss) 0%, var(--fjord-deep) 48%, #0d2839 100%);
        }

        .hero-bg {
            position: absolute;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .hero-bg > div { position: absolute; left: -8%; right: -8%; }

        /* 晨光：地平線上緩慢呼吸的暖金色光暈 */
        .hz-glow {
            top: 38%;
            height: 46%;
            background: radial-gradient(ellipse 55% 100% at 50% 55%, rgba(200, 162, 102, 0.30) 0%, rgba(200, 162, 102, 0) 68%);
            animation: breathe 11s ease-in-out infinite alternate;
        }

        /* 遠山：最淡、最遠，帶一點藍霧 */
        .hz-mountains--far {
            bottom: 22%;
            height: 30%;
            opacity: 0.15;
            background: var(--ocean-teal);
            filter: blur(1.5px);
            clip-path: polygon(0% 100%, 0% 62%, 9% 48%, 19% 60%, 29% 34%, 41% 55%, 52% 30%, 64% 52%, 76% 36%, 88% 58%, 100% 44%, 100% 100%);
            animation: driftFar 90s ease-in-out infinite alternate;
        }

        /* 地平線光帶：介於遠山與中景之間，極淡、幾不可見，
           暗示畫面之外還有更遼闊的天地在延伸（Improvement 1） */
        .hz-horizon {
            top: 51%;
            height: 18%;
            background: linear-gradient(180deg,
                rgba(234, 232, 226, 0.085) 0%,
                rgba(200, 162, 102, 0.27) 50%,
                rgba(234, 232, 226, 0.07) 100%);
            filter: blur(22px);
        }

        /* 峽灣切口：兩座山之間透出的一道極淡光帶，暗示一道峽灣入口 */
        .hz-fjord {
            bottom: 20%;
            height: 34%;
            opacity: 0.14;
            background: linear-gradient(180deg, var(--mist-white) 0%, rgba(234, 232, 226, 0) 100%);
            clip-path: polygon(46% 100%, 50% 20%, 54% 100%);
            filter: blur(2px);
        }

        /* 近山：較深、較清楚的稜線 */
        .hz-mountains--mid {
            bottom: 0%;
            height: 26%;
            opacity: 0.38;
            background: #0a2130;
            clip-path: polygon(0% 100%, 0% 70%, 12% 45%, 24% 66%, 36% 38%, 48% 62%, 58% 20%, 70% 58%, 82% 40%, 94% 64%, 100% 52%, 100% 100%);
            animation: driftNear 65s ease-in-out infinite alternate;
        }

        /* 標誌性主峰：全站唯一較有輪廓的符號級圖形——三峰剪影，
           峰頂鑲一線晨光，是離開頁面後仍會留下的「一個畫面」（Improvement 2） */
        .hz-signature-peak {
            bottom: 16%;
            height: 24%;
            opacity: 0.42;
            background: linear-gradient(180deg,
                rgba(200, 162, 102, 0.42) 0%,
                rgba(200, 162, 102, 0.08) 9%,
                rgba(8, 22, 34, 0.85) 20%,
                rgba(8, 22, 34, 0.95) 100%);
            clip-path: polygon(0% 100%, 26% 42%, 38% 58%, 50% 10%, 62% 56%, 76% 36%, 100% 100%);
            animation: peakGlow 14s ease-in-out infinite alternate;
        }
        .hero-bg > .hz-signature-peak { left: 22%; right: 22%; }

        /* 低雲霧：沿地平線飄移的柔霧 */
        .hz-mist--far {
            top: 46%;
            height: 22%;
            background: radial-gradient(ellipse 60% 100% at 30% 50%, rgba(234, 232, 226, 0.10) 0%, rgba(234, 232, 226, 0) 70%),
                        radial-gradient(ellipse 50% 100% at 75% 50%, rgba(234, 232, 226, 0.08) 0%, rgba(234, 232, 226, 0) 70%);
            filter: blur(14px);
            animation: driftFar 110s ease-in-out infinite alternate;
        }

        .hz-mist--near {
            bottom: 8%;
            height: 20%;
            background: radial-gradient(ellipse 55% 100% at 60% 60%, rgba(234, 232, 226, 0.09) 0%, rgba(234, 232, 226, 0) 70%);
            filter: blur(18px);
            animation: driftNear 75s ease-in-out infinite alternate;
        }

        @keyframes breathe {
            from { opacity: 0.55; transform: scale(1); }
            to   { opacity: 0.9;  transform: scale(1.05); }
        }
        @keyframes peakGlow {
            from { opacity: 0.36; }
            to   { opacity: 0.48; }
        }
        @keyframes driftFar {
            from { transform: translateX(-2.5%); }
            to   { transform: translateX(2.5%); }
        }
        @keyframes driftNear {
            from { transform: translateX(3%); }
            to   { transform: translateX(-3.5%); }
        }
        @media (prefers-reduced-motion: reduce) {
            .hz-glow, .hz-mountains--far, .hz-mountains--mid, .hz-mist--far, .hz-mist--near, .hz-signature-peak {
                animation: none;
            }
        }

        .hero-content {
            position: relative;
            z-index: 1;
            max-width: 800px;
            animation: fadeIn 1.4s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .hero-title {
            font-size: 5.4rem;
            font-weight: 300;
            letter-spacing: 18px;
            margin-bottom: 28px;
            color: var(--mist-white);
            font-family: 'Noto Serif TC', serif;
            line-height: 1.1;
            text-shadow: 0 0 40px rgba(200, 162, 102, 0.25);
        }

        .hero-subtitle {
            font-size: 1.25rem;
            color: rgba(234, 232, 226, 0.78);
            letter-spacing: 2.5px;
            line-height: 2;
            margin-bottom: 64px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 40px;
            margin-bottom: 64px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-number {
            font-size: 3.5rem;
            color: var(--morning-gold);
            font-weight: 300;
            margin-bottom: 10px;
            letter-spacing: 3px;
        }

        .stat-label {
            font-size: 0.95rem;
            color: rgba(234, 232, 226, 0.6);
            letter-spacing: 2px;
        }

        .placeholder {
            color: rgba(200, 162, 102, 0.55);
            font-style: italic;
        }

        .scroll-button {
            display: inline-flex;
            align-items: center;
            gap: 15px;
            border: 2px solid var(--morning-gold);
            border-radius: 50px;
            padding: 12px 40px;
            color: var(--morning-gold);
            text-decoration: none;
            font-size: 0.95rem;
            letter-spacing: 2px;
            transition: all 0.3s ease;
            cursor: pointer;
            background: rgba(10, 30, 46, 0.2);
        }

        .scroll-button:hover {
            background: rgba(200, 162, 102, 0.12);
        }

        .scroll-button svg {
            width: 16px;
            height: 16px;
            stroke: var(--morning-gold);
            fill: none;
            stroke-width: 2;
        }

        .content {
            padding: 60px 40px;
        }

        .section-title {
            font-size: 2rem;
            color: var(--morning-gold);
            margin-bottom: 40px;
            letter-spacing: 2px;
            text-align: center;
        }

        .coming-soon {
            text-align: center;
            padding: 60px 40px;
            color: #a8a09a;
            font-size: 1.2rem;
            letter-spacing: 2px;
        }

        .trips-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
            margin-bottom: 60px;
        }

        .trip-card {
            border: 2px solid rgba(200, 162, 102, 0.3);
            border-radius: 20px;
            padding: 30px;
            background: rgba(19, 50, 74, 0.4);
            transition: all 0.3s ease;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
        }

        .trip-card:hover {
            border-color: var(--morning-gold);
            background: rgba(24, 92, 99, 0.35);
            transform: translateY(-5px);
        }

        .trip-name {
            font-size: 1.3rem;
            color: var(--morning-gold);
            margin-bottom: 12px;
            letter-spacing: 2px;
        }

        .trip-desc {
            font-size: 0.95rem;
            color: #a8a09a;
            line-height: 1.6;
        }

        .trip-status {
            font-size: 0.85rem;
            color: rgba(200, 162, 102, 0.55);
            margin-top: 12px;
            font-style: italic;
        }

        .footer {
            padding: 40px;
            text-align: center;
            color: #8a8580;
            border-top: 1px solid rgba(200, 162, 102, 0.1);
        }

        .footer-nav {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 20px;
        }

        .footer-nav a {
            color: var(--morning-gold);
            text-decoration: none;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }

        .footer-nav a:hover {
            opacity: 0.8;
        }

        @media (max-width: 768px) {
            .hero { min-height: auto; padding: 60px 20px; }
            .hero-title { font-size: 3rem; letter-spacing: 9px; }
            .hero-subtitle { font-size: 1rem; letter-spacing: 1.5px; }
            .stat-number { font-size: 2.5rem; }
            .header { padding: 15px 20px; }
            .breadcrumb { padding: 15px 20px; font-size: 0.8rem; }
        }
    </style>
</head>
<body>
    <header class="header">
        <button style="background: none; border: none; color: var(--morning-gold); font-size: 1.5rem; cursor: pointer;">←</button>
        <h1 class="header-title">第二卷《漸見》— 旅魂</h1>
        <div class="header-menu">⋯</div>
    </header>

    <nav class="breadcrumb">

        <span>第二卷</span>
        <span>|</span>
        <span>VOLUME總覽</span>

</body>
</html>
