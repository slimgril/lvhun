<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>第二卷《漸見》— 旅魂</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Serif TC', 'Noto Sans TC', serif;
            background: linear-gradient(135deg, #1a4d3e 0%, #0d2818 100%);
            color: #e8e4df;
            overflow-x: hidden;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background: rgba(13, 40, 24, 0.9);
            border-bottom: 1px solid rgba(201, 169, 98, 0.2);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-title {
            font-size: 1.2rem;
            font-weight: 500;
            letter-spacing: 2px;
            color: #c9a962;
        }

        .header-menu {
            font-size: 1.5rem;
            cursor: pointer;
            color: #c9a962;
        }

        .breadcrumb {
            padding: 20px 40px;
            font-size: 0.9rem;
            color: #8a8580;
            letter-spacing: 1px;
            background: rgba(13, 40, 24, 0.6);
            border-bottom: 1px solid rgba(201, 169, 98, 0.1);
        }

        .breadcrumb span {
            margin: 0 12px;
        }

        .hero {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 70vh;
            position: relative;
            padding: 80px 40px;
            text-align: center;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(ellipse at center, rgba(20,70,55,0.2) 0%, rgba(13,40,24,0.5) 100%);
            pointer-events: none;
        }

        .hero-content {
            position: relative;
            z-index: 1;
            max-width: 800px;
            animation: fadeIn 1s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .hero-title {
            font-size: 5rem;
            font-weight: 300;
            letter-spacing: 15px;
            margin-bottom: 20px;
            color: #e8e4df;
            font-family: 'Noto Serif TC', serif;
            line-height: 1.1;
        }

        .hero-subtitle {
            font-size: 1.3rem;
            color: #a8a09a;
            letter-spacing: 3px;
            line-height: 1.8;
            margin-bottom: 60px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 40px;
            margin-bottom: 60px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-number {
            font-size: 3.5rem;
            color: #c9a962;
            font-weight: 300;
            margin-bottom: 10px;
            letter-spacing: 3px;
        }

        .stat-label {
            font-size: 0.95rem;
            color: #a8a09a;
            letter-spacing: 2px;
        }

        .placeholder {
            color: #665533;
            font-style: italic;
        }

        .scroll-button {
            display: inline-flex;
            align-items: center;
            gap: 15px;
            border: 2px solid #c9a962;
            border-radius: 50px;
            padding: 12px 40px;
            color: #c9a962;
            text-decoration: none;
            font-size: 0.95rem;
            letter-spacing: 2px;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .scroll-button:hover {
            background: rgba(201, 169, 98, 0.1);
        }

        .scroll-button svg {
            width: 16px;
            height: 16px;
            stroke: #c9a962;
            fill: none;
            stroke-width: 2;
        }

        .content {
            padding: 60px 40px;
        }

        .section-title {
            font-size: 2rem;
            color: #c9a962;
            margin-bottom: 40px;
            letter-spacing: 2px;
            text-align: center;
        }

        .coming-soon {
            text-align: center;
            padding: 60px 40px;
            color: #a8a09a;
            font-size: 1.2rem;
            letter-spacing: 2px;
        }

        .trips-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
            margin-bottom: 60px;
        }

        .trip-card {
            border: 2px solid rgba(201, 169, 98, 0.3);
            border-radius: 20px;
            padding: 30px;
            background: rgba(26, 77, 62, 0.4);
            transition: all 0.3s ease;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
        }

        .trip-card:hover {
            border-color: #c9a962;
            background: rgba(26, 77, 62, 0.6);
            transform: translateY(-5px);
        }

        .trip-name {
            font-size: 1.3rem;
            color: #c9a962;
            margin-bottom: 12px;
            letter-spacing: 2px;
        }

        .trip-desc {
            font-size: 0.95rem;
            color: #a8a09a;
            line-height: 1.6;
        }

        .trip-status {
            font-size: 0.85rem;
            color: #665533;
            margin-top: 12px;
            font-style: italic;
        }

        .footer {
            padding: 40px;
            text-align: center;
            color: #8a8580;
            border-top: 1px solid rgba(201, 169, 98, 0.1);
        }

        .footer-nav {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 20px;
        }

        .footer-nav a {
            color: #c9a962;
            text-decoration: none;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }

        .footer-nav a:hover {
            opacity: 0.8;
        }

        @media (max-width: 768px) {
            .hero-title {
                font-size: 3rem;
                letter-spacing: 8px;
            }

            .hero-subtitle {
                font-size: 1rem;
            }

            .stat-number {
                font-size: 2.5rem;
            }

            .header {
                padding: 15px 20px;
            }

            .breadcrumb {
                padding: 15px 20px;
                font-size: 0.8rem;
            }

            .hero {
                padding: 40px 20px;
                min-height: auto;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <button style="background: none; border: none; color: #c9a962; font-size: 1.5rem; cursor: pointer;">←</button>
        <h1 class="header-title">第二卷《漸見》— 旅魂</h1>
        <div class="header-menu">⋯</div>
    </header>

    <nav class="breadcrumb">
        <span style="color: #c9a962;">旅魂</span>
        <span>|</span>
        <span>第二卷</span>
        <span>|</span>
        <span>VOLUME總覽</span>
        <span>|</span>
        <span>第二卷</span>
        <span>|</span>
        <span>精選</span>
    </nav>

    <section class="hero">
        <div class="hero-content">
            <h2 class="hero-title">漸見</h2>
            <p class="hero-subtitle">
                <span class="placeholder">[副標題待定]</span>
            </p>

            <div class="stats">
                <div class="stat-item">
                    <div class="stat-number placeholder">—</div>
                    <div class="stat-label">旅程天數</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number placeholder">—</div>
                    <div class="stat-label">目的地</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number placeholder">—</div>
                    <div class="stat-label">國家</div>
                </div>
            </div>

            <button class="scroll-button">
                SCROLL
                <svg viewBox="0 0 24 24">
                    <path d="M12 5v14M5 15l7 7 7-7"/>
                </svg>
            </button>

    </section>

    <section class="content">
        <h3 class="section-title">三段旅程（籌備中）</h3>

        <div class="trips-grid">
            <div class="trip-card">
                <div class="trip-name">九寨溝</div>
                <div class="trip-desc">四川秀麗山水，醉美鈣華景觀</div>
                <div class="trip-status">⏳ 即將啟程</div>
            </div>

            <div class="trip-card">
                <div class="trip-name">挪威郵輪</div>
                <div class="trip-desc">北歐峽灣風光，極地船旅體驗</div>
                <div class="trip-status">📅 籌備中</div>
            </div>

            <div class="trip-card">
                <div class="trip-name">
                    <span class="placeholder">[未定名]</span>
                </div>
                <div class="trip-desc">
                    <span class="placeholder">敬請期待第三段旅程</span>
                </div>
                <div class="trip-status">📋 規劃中</div>
            </div>
        </div>
    </section>

    <footer class="footer">
        <div class="footer-nav">
            <a href="../index.html">返回首頁</a>
            <a href="../vol1/index.html">← 上一卷</a>
        </div>
        <p>© 2026 旅魂 — 陳文斌的旅途紀行</p>
    </footer>
</body>
</html>
